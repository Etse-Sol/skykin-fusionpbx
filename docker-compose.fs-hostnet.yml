# Run FreeSWITCH on the host network so Ethio INVITEs use 10.0.0.93
# natively (Via/Contact/source). Bridge+SNAT leaves Via as 172.22.0.2
# and the SBC never replies.
#
#   docker compose -f docker-compose.yml -f docker-compose.fs-hostnet.yml up -d
#
# Host-network FreeSWITCH is not on the compose DNS network, so nginx
# cannot resolve hostname "freeswitch" (crash loop:
#   host not found in upstream "freeswitch"
# ). Docker often cannot complete TCP to 10.0.0.93:7443 (rp_filter);
# live call-center-web must proxy /wss/ to the docker-network gateway
# :7443 with proxy_ssl_verify off (SIP.js transport=WSS; do not use :5066).

services:
  freeswitch:
    network_mode: host
    ports: !reset []
    environment:
      EXT_RTP_IP: ${EXT_RTP_IP:-10.0.0.93}
      EXT_SIP_IP: ${EXT_SIP_IP:-10.0.0.93}
      TRUNK_PROXY: ${TRUNK_PROXY:-10.208.233.134:5080}
      TRUNK_REGISTER: ${TRUNK_REGISTER:-false}

  web:
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "freeswitch:${EXT_SIP_IP:-10.0.0.93}"
    environment:
      ESL_HOST: ${ESL_HOST:-freeswitch}
      FREESWITCH_WS_UPSTREAM: ${FREESWITCH_WS_UPSTREAM:-freeswitch:5066}

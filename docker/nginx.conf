# SkyKin web — HTTP (80) and HTTPS (443, self-signed by default).
# Browsers only allow microphone/WebRTC on secure origins, so agents must use
# the HTTPS URL. The softphone WebSocket is proxied at /wss/ so it shares the
# page's certificate (no separate cert prompt, avoids WSS 1006).

server {
    listen 80;
    server_name _;
    root /var/www/fusionpbx;
    index index.php;

    client_max_body_size 80M;

    location = /favicon.ico {
        try_files /favicon.ico =404;
        access_log off;
        expires 7d;
    }

    location = /favicon.png {
        try_files /favicon.png =404;
        access_log off;
        expires 7d;
    }

    location /wss/ {
        # Proxy to FreeSWITCH's WSS (secure WebSocket) listener. SIP.js connects
        # over wss:// and stamps Via/Contact transport as WSS; FreeSWITCH only
        # routes the response correctly when the upstream connection is also WSS.
        # Proxying to the plain ws (5066) listener makes FreeSWITCH silently drop
        # every REGISTER response (agents stay "Not Registered").
        proxy_pass FREESWITCH_WS_SCHEME://FREESWITCH_WS_UPSTREAM;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # FusionPBX's CDR importer authenticates with HTTP basic auth. fastcgi_params
        # does not forward the Authorization header, so PHP_AUTH_USER/PW would be
        # empty and every mod_xml_cdr POST would be rejected.
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(ht|git|env) {
        deny all;
    }

    location ~ \.db$ {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /var/www/fusionpbx;
    index index.php;

    client_max_body_size 80M;

    # If an agent opens the HTTP bookmark on this TLS port, nginx emits 497.
    # Recover by redirecting to the HTTPS URL (port from WEB_HTTPS_PORT).
    error_page 497 =307 https://$host:__WEB_HTTPS_PORT__$request_uri;

    ssl_certificate     /etc/ssl/skykin/fullchain.pem;
    ssl_certificate_key /etc/ssl/skykin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location = /favicon.ico {
        try_files /favicon.ico =404;
        access_log off;
        expires 7d;
    }

    location = /favicon.png {
        try_files /favicon.png =404;
        access_log off;
        expires 7d;
    }

    location /wss/ {
        # See the HTTP block above: must proxy to FreeSWITCH's WSS listener.
        proxy_pass FREESWITCH_WS_SCHEME://FREESWITCH_WS_UPSTREAM;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(ht|git|env) {
        deny all;
    }

    location ~ \.db$ {
        deny all;
    }
}

server {
    listen 80;
    server_name _;
    root /var/www/fusionpbx;
    index index.php;

    client_max_body_size 80M;

    # Agent softphone WebSocket proxy — point at FreeSWITCH on the host/VM
    # Set FREESWITCH_WS_UPSTREAM in compose (default host.docker.internal:5066)
    location /wss/ {
        # Trailing slash strips /wss/ so FreeSWITCH sees /. Without it the
        # browser gets WebSocket close 1006.
        proxy_pass http://FREESWITCH_WS_UPSTREAM/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(ht|git|env) {
        deny all;
    }

    location ~ \.db$ {
        deny all;
    }
}
